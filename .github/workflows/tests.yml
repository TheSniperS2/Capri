name: Pruebas Windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Comprobar scripts de la extension
        run: |
          Get-ChildItem -LiteralPath integraciones/opera-capri -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: python -m pip install -r requirements.txt
      - run: python empaquetar.py
      - run: python -m unittest discover -s tests -v
